<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Бесплатный курс Python</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.0.0/index.css">
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  * { font-family: 'Inter', sans-serif; }
  code, pre, .code-editor { font-family: 'Fira Code', monospace !important; }
  body { background: #1b1b32; color: #d0d0d5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #1b1b32; }
  ::-webkit-scrollbar-thumb { background: #3b3b4f; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #858591; }
  
  .lesson-link { transition: all 0.2s; border-left: 3px solid transparent; }
  .lesson-link:hover { background: #2a2a40; border-left-color: #80bdff; }
  .lesson-link.active { background: #2a2a40; border-left-color: #acd157; color: #fff; }
  .lesson-link.completed .check { color: #acd157; }
  
  .code-editor {
    background: #2a2a40;
    color: #f0f0f0;
    border: 1px solid #3b3b4f;
    border-radius: 6px;
    padding: 16px;
    width: 100%;
    min-height: 200px;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    tab-size: 4;
    outline: none;
  }
  .code-editor:focus { border-color: #80bdff; box-shadow: 0 0 0 2px rgba(128,189,255,0.2); }
  
  .output-box {
    background: #0a0a23;
    border: 1px solid #3b3b4f;
    border-radius: 6px;
    padding: 16px;
    min-height: 100px;
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d0d0d5;
  }
  
  .btn-primary {
    background: #acd157;
    color: #1b1b32;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .btn-primary:hover { background: #c0e070; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  
  .btn-secondary {
    background: #3b3b4f;
    color: #d0d0d5;
    padding: 10px 20px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .btn-secondary:hover { background: #4b4b5f; }
  
  .content-area h1 { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 1rem; }
  .content-area h2 { font-size: 1.5rem; font-weight: 600; color: #fff; margin: 1.5rem 0 0.75rem; }
  .content-area h3 { font-size: 1.2rem; font-weight: 600; color: #fff; margin: 1.25rem 0 0.5rem; }
  .content-area p { margin-bottom: 1rem; line-height: 1.7; }
  .content-area ul, .content-area ol { margin-bottom: 1rem; padding-left: 1.5rem; }
  .content-area li { margin-bottom: 0.5rem; line-height: 1.6; }
  .content-area code:not(pre code) {
    background: #2a2a40;
    color: #f78c6c;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .content-area pre {
    background: #2a2a40;
    border-left: 3px solid #acd157;
    padding: 14px;
    border-radius: 6px;
    margin: 1rem 0;
    overflow-x: auto;
  }
  .content-area pre code { color: #f0f0f0; }
  .content-area blockquote {
    border-left: 3px solid #80bdff;
    background: rgba(128,189,255,0.08);
    padding: 12px 16px;
    margin: 1rem 0;
    border-radius: 0 6px 6px 0;
  }
  .content-area .task-box {
    background: rgba(172,209,87,0.08);
    border: 1px solid #acd157;
    border-radius: 8px;
    padding: 16px;
    margin: 1.5rem 0;
  }
  .content-area .task-box h4 { color: #acd157; margin-bottom: 0.5rem; }
  
  .progress-bar {
    height: 6px;
    background: #3b3b4f;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #acd157, #80bdff);
    transition: width 0.5s;
  }
  
  .sidebar {
    background: #0a0a23;
    border-right: 1px solid #3b3b4f;
    transition: transform 0.3s;
  }
  
  @media (max-width: 1024px) {
    .sidebar { position: fixed; z-index: 40; height: 100vh; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
  }
  
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 20px;
    border-radius: 8px;
    color: #fff;
    font-weight: 500;
    z-index: 100;
    animation: slideIn 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
  
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; animation: fadeIn 0.2s;
  }
  
  .py-keyword { color: #c792ea; }
  .py-string { color: #c3e88d; }
  .py-number { color: #f78c6c; }
  .py-comment { color: #676e95; font-style: italic; }
  .py-builtin { color: #82aaff; }
  .py-func { color: #82aaff; }
</style>
</head>
<body>

<!-- Header -->
<header class="bg-[#0a0a23] border-b border-[#3b3b4f] sticky top-0 z-30">
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-3">
      <button id="menuBtn" class="lg:hidden text-white p-2">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#acd157] to-[#80bdff] flex items-center justify-center font-bold text-[#1b1b32]">Py</div>
        <div>
          <div class="font-bold text-white text-lg leading-none">PyCamp</div>
          <div class="text-xs text-gray-400">Бесплатный курс Python</div>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="hidden md:flex items-center gap-3 text-sm">
        <span class="text-gray-400">Прогресс:</span>
        <div class="w-40 progress-bar"><div id="headerProgress" class="progress-fill" style="width:0%"></div></div>
        <span id="headerProgressText" class="text-white font-semibold">0%</span>
      </div>
      <button onclick="showCertificate()" class="btn-secondary text-sm hidden sm:block">🎓 Сертификат</button>
      <button onclick="resetProgress()" class="text-gray-400 hover:text-white text-sm" title="Сбросить прогресс">↺</button>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar w-80 min-h-screen flex-shrink-0 overflow-y-auto">
    <div class="p-4">
      <div class="mb-4">
        <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Сертификация</div>
        <div class="font-bold text-white">Python Programming</div>
        <div class="text-sm text-gray-400 mt-1"><span id="completedCount">0</span> / <span id="totalCount">0</span> уроков</div>
        <div class="progress-bar mt-2"><div id="sidebarProgress" class="progress-fill" style="width:0%"></div></div>
      </div>
      <nav id="lessonNav" class="space-y-1 text-sm"></nav>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0">
    <div class="max-w-4xl mx-auto p-6 md:p-10">
      <div id="content" class="content-area fade-in"></div>
      
      <!-- Editor -->
      <div id="editorSection" class="mt-8 hidden">
        <div class="flex items-center justify-between mb-2">
          <div class="text-sm text-gray-400">💻 Редактор Python</div>
          <div class="flex gap-2">
            <button onclick="resetEditor()" class="btn-secondary text-sm py-1 px-3">Сбросить</button>
            <button onclick="runCode()" id="runBtn" class="btn-primary text-sm py-1 px-4">▶ Запустить</button>
          </div>
        </div>
        <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
        <div class="mt-3">
          <div class="text-sm text-gray-400 mb-1">📤 Вывод:</div>
          <div id="output" class="output-box">Нажмите «Запустить» для выполнения кода</div>
        </div>
        <div id="taskFeedback" class="mt-4 hidden"></div>
        <div class="flex justify-between mt-6">
          <button onclick="prevLesson()" id="prevBtn" class="btn-secondary">← Предыдущий</button>
          <button onclick="checkTask()" id="checkBtn" class="btn-primary hidden">✓ Проверить задание</button>
          <button onclick="nextLesson()" id="nextBtn" class="btn-primary">Следующий →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Loading overlay for Pyodide -->
<div id="loadingOverlay" class="fixed inset-0 bg-[#1b1b32] flex items-center justify-center z-50">
  <div class="text-center">
    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-[#acd157] to-[#80bdff] flex items-center justify-center font-bold text-[#1b1b32] text-2xl mx-auto mb-4 animate-pulse">Py</div>
    <div class="text-white font-bold text-xl mb-2">Загрузка Python...</div>
    <div class="text-gray-400 text-sm">Инициализация интерпретатора Pyodide</div>
    <div class="progress-bar w-64 mx-auto mt-4"><div id="loadProgress" class="progress-fill" style="width:0%"></div></div>
  </div>
</div>

<script>
// ============ COURSE DATA ============
const lessons = [
  {
    id: 'intro',
    title: 'Введение в Python',
    section: 'Основы',
    theory: `
      <h1>🐍 Введение в Python</h1>
      <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
      
      <h2>Почему Python?</h2>
      <ul>
        <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
        <li><strong>Огромное сообщество</strong> — миллионы разработчиков и тысячи библиотек</li>
        <li><strong>Универсальность</strong> — от скриптов до искусственного интеллекта</li>
        <li><strong>Востребованность</strong> — одна из самых популярных профессий в IT</li>
      </ul>
      
      <h2>Ваша первая программа</h2>
      <p>Традиционно изучение любого языка начинают с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <strong>строка</strong> (string).</p>
      
      <blockquote>💡 Python назван в честь комедийного шоу «Monty Python's Flying Circus», а не в честь змеи!</blockquote>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Выведите на экран фразу <code>Hello, Python!</code></p>
      </div>
    `,
    starterCode: `# Выведите "Hello, Python!"\n`,
    check: (output) => output.trim() === 'Hello, Python!'
  },
  {
    id: 'comments',
    title: 'Комментарии',
    section: 'Основы',
    theory: `
      <h1>💬 Комментарии</h1>
      <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они нужны для вас и других разработчиков.</p>
      
      <h2>Однострочные комментарии</h2>
      <p>Начинаются с символа <code>#</code>:</p>
      <pre><code># Это комментарий
print("Привет")  # Комментарий после кода</code></pre>
      
      <h2>Многострочные комментарии</h2>
      <p>Используются тройные кавычки:</p>
      <pre><code>"""
Это многострочный
комментарий (docstring)
"""
print("Код работает")</code></pre>
      
      <blockquote>💡 Хорошие комментарии объясняют <em>почему</em> сделан именно так, а не <em>что</em> делает код.</blockquote>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Добавьте комментарий <code># Мой первый код</code> и выведите слово <code>Python</code></p>
      </div>
    `,
    starterCode: `# Напишите комментарий и выведите "Python"\n`,
    check: (output) => output.trim() === 'Python'
  },
  {
    id: 'variables',
    title: 'Переменные',
    section: 'Основы',
    theory: `
      <h1>📦 Переменные</h1>
      <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      
      <h2>Создание переменных</h2>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
      
      <h2>Правила именования</h2>
      <ul>
        <li>Могут содержать буквы, цифры и символ <code>_</code></li>
        <li>Не могут начинаться с цифры</li>
        <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
        <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
      </ul>
      
      <h2>Множественное присваивание</h2>
      <pre><code>x, y, z = 1, 2, 3
a = b = c = 0</code></pre>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Создайте переменные <code>name</code> со значением <code>"Python"</code> и <code>version</code> со значением <code>3</code>. Выведите их через пробел в одну строку.</p>
      </div>
    `,
    starterCode: `# Создайте переменные и выведите их\n`,
    check: (output) => output.trim() === 'Python 3'
  },
  {
    id: 'data-types',
    title: 'Типы данных',
    section: 'Основы',
    theory: `
      <h1>🔢 Типы данных</h1>
      <p>Каждое значение в Python имеет тип. Основные типы:</p>
      
      <h2>Числа</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
      </ul>
      
      <h2>Строки</h2>
      <p><code>str</code> — строки текста: <code>"Привет"</code>, <code>'Мир'</code></p>
      
      <h2>Логический тип</h2>
      <p><code>bool</code> — <code>True</code> (истина) или <code>False</code> (ложь)</p>
      
      <h2>Проверка типа</h2>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "text"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
      
      <h2>Преобразование типов</h2>
      <pre><code>num_str = "123"
num = int(num_str)    # Преобразование в число
flt = float("3.14")   # В дробное
s = str(100)          # В строку</code></pre>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Создайте переменную <code>x</code> со значением <code>"10"</code> (строка). Преобразуйте её в число, умножьте на 2 и выведите результат (<code>20</code>).</p>
      </div>
    `,
    starterCode: `x = "10"\n# Преобразуйте и умножьте на 2\n`,
    check: (output) => output.trim() === '20'
  },
  {
    id: 'strings',
    title: 'Работа со строками',
    section: 'Основы',
    theory: `
      <h1>📝 Строки</h1>
      <p>Строки — это последовательности символов. С ними можно выполнять множество операций.</p>
      
      <h2>Конкатенация и повторение</h2>
      <pre><code>a = "Привет"
b = "Мир"
print(a + " " + b)  # Привет Мир
print("Ха" * 3)      # ХаХаХа</code></pre>
      
      <h2>Форматирование строк (f-strings)</h2>
      <p>Современный и удобный способ:</p>
      <pre><code>name = "Алиса"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      
      <h2>Методы строк</h2>
      <pre><code>s = "hello world"
print(s.upper())        # HELLO WORLD
print(s.lower())        # hello world
print(s.title())        # Hello World
print(s.replace("hello", "hi"))  # hi world
print(len(s))           # 11 (длина)</code></pre>
      
      <h2>Индексы и срезы</h2>
      <pre><code>s = "Python"
print(s[0])     # P (первый символ)
print(s[-1])    # n (последний)
print(s[0:3])   # Pyt (срез с 0 по 2)</code></pre>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Создайте переменные <code>first = "Py"</code> и <code>second = "thon"</code>. С помощью f-strings выведите: <code>Язык Python мощный!</code></p>
      </div>
    `,
    starterCode: `first = "Py"\nsecond = "thon"\n# Используйте f-strings\n`,
    check: (output) => output.trim() === 'Язык Python мощный!'
  },
  {
    id: 'input',
    title: 'Ввод данных',
    section: 'Основы',
    theory: `
      <h1>⌨️ Ввод данных</h1>
      <p>Функция <code>input()</code> позволяет получить данные от пользователя. Она всегда возвращает строку.</p>
      
      <pre><code>name = input("Как вас зовут? ")
print(f"Привет, {name}!")</code></pre>
      
      <h2>Ввод чисел</h2>
      <p>Так как <code>input()</code> возвращает строку, для чисел нужно преобразование:</p>
      <pre><code>age = int(input("Ваш возраст: "))
print(f"Через год вам будет {age + 1}")</code></pre>
      
      <blockquote>⚠️ В наших заданиях <code>input()</code> не работает (нет интерактивного режима). Используйте переменные для тестирования.</blockquote>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Создайте переменную <code>name = "Мир"</code> и выведите: <code>Привет, Мир!</code></p>
      </div>
    `,
    starterCode: `# Создайте переменную name и выведите приветствие\n`,
    check: (output) => output.trim() === 'Привет, Мир!'
  },
  {
    id: 'operators',
    title: 'Операторы',
    section: 'Основы',
    theory: `
      <h1>➕ Операторы</h1>
      
      <h2>Арифметические операторы</h2>
      <pre><code>a, b = 10, 3
print(a + b)   # 13  сложение
print(a - b)   # 7   вычитание
print(a * b)   # 30  умножение
print(a / b)   # 3.333... деление
print(a // b)  # 3   целочисленное деление
print(a % b)   # 1   остаток от деления
print(a ** b)  # 1000 возведение в степень</code></pre>
      
      <h2>Операторы сравнения</h2>
      <pre><code>x = 5
print(x == 5)   # True  равно
print(x != 5)   # False не равно
print(x > 3)    # True  больше
print(x < 3)    # False меньше
print(x >= 5)   # True  больше или равно
print(x <= 4)   # False меньше или равно</code></pre>
      
      <h2>Логические операторы</h2>
      <pre><code>print(True and False)  # False
print(True or False)   # True
print(not True)        # False

age = 25
print(age > 18 and age < 60)  # True</code></pre>
      
      <div class="task-box">
        <h4>📝 Задание</h4>
        <p>Вычислите и выведите остаток от деления <code>17</code> на <code>5</code> (должно быть <code>2</code>).</p>
      </div>

// ============ STATE ============
let currentLessonIndex = 0;
let completedLessons = JSON.parse(localStorage.getItem('pycamp_completed') || '[]');
let pyodide = null;
let isPyodideReady = false;

// ============ INIT ============
async function initPyodide() {
  const loadProgress = document.getElementById('loadProgress');
  try {
    loadProgress.style.width = '30%';
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
    });
    loadProgress.style.width = '70%';
    
    // Redirect stdout/stderr
    pyodide.runPython(`
import sys
from io import StringIO
    `);
    
    loadProgress.style.width = '100%';
    isPyodideReady = true;
    
    setTimeout(() => {
      document.getElementById('loadingOverlay').style.display = 'none';
    }, 300);
  } catch (e) {
    console.error('Pyodide load error:', e);
    document.getElementById('loadingOverlay').innerHTML = `
      <div class="text-center">
        <div class="text-red-400 text-xl mb-2">⚠️ Ошибка загрузки</div>
        <div class="text-gray-400">Не удалось загрузить Python. Проверьте интернет.</div>
        <button onclick="location.reload()" class="btn-primary mt-4">Повторить</button>
      </div>
    `;
  }
}

function renderNav() {
  const nav = document.getElementById('lessonNav');
  const sections = {};
  lessons.forEach((lesson, idx) => {
    if (!sections[lesson.section]) sections[lesson.section] = [];
    sections[lesson.section].push({ ...lesson, idx });
  });
  
  nav.innerHTML = Object.entries(sections).map(([section, items]) => `
    <div class="mb-4">
      <div class="text-xs uppercase tracking-wider text-gray-500 font-bold mb-2 px-3">${section}</div>
      ${items.map(item => `
        <a href="#" onclick="goToLesson(${item.idx}); return false;" 
           class="lesson-link block px-3 py-2 rounded text-sm ${currentLessonIndex === item.idx ? 'active' : ''} ${completedLessons.includes(item.id) ? 'completed' : ''}">
          <div class="flex items-center gap-2">
            <span class="check text-gray-600">${completedLessons.includes(item.id) ? '✓' : '○'}</span>
            <span class="flex-1">${item.title}</span>
          </div>
        </a>
      `).join('')}
    </div>
  `).join('');
  
  document.getElementById('totalCount').textContent = lessons.length;
  document.getElementById('completedCount').textContent = completedLessons.length;
  updateProgress();
}

function updateProgress() {
  const percent = Math.round((completedLessons.length / lessons.length) * 100);
  document.getElementById('headerProgress').style.width = percent + '%';
  document.getElementById('headerProgressText').textContent = percent + '%';
  document.getElementById('sidebarProgress').style.width = percent + '%';
}

function renderLesson() {
  const lesson = lessons[currentLessonIndex];
  document.getElementById('content').innerHTML = lesson.theory;
  document.getElementById('content').className = 'content-area fade-in';
  
  document.getElementById('editorSection').classList.remove('hidden');
  document.getElementById('codeEditor').value = lesson.starterCode;
  document.getElementById('output').textContent = 'Нажмите «Запустить» для выполнения кода';
  document.getElementById('taskFeedback').classList.add('hidden');
  
  document.getElementById('prevBtn').disabled = currentLessonIndex === 0;
  document.getElementById('nextBtn').disabled = currentLessonIndex === lessons.length - 1;
  
  renderNav();
  window.scrollTo(0, 0);
}

function goToLesson(idx) {
  currentLessonIndex = idx;
  renderLesson();
  document.getElementById('sidebar').classList.remove('open');
}

function prevLesson() {
  if (currentLessonIndex > 0) {
    currentLessonIndex--;
    renderLesson();
  }
}

function nextLesson() {
  if (currentLessonIndex < lessons.length - 1) {
    currentLessonIndex++;
    renderLesson();
  }
}

function resetEditor() {
  const lesson = lessons[currentLessonIndex];
  document.getElementById('codeEditor').value = lesson.starterCode;
  document.getElementById('output').textContent = 'Нажмите «Запустить» для выполнения кода';
  document.getElementById('taskFeedback').classList.add('hidden');
}

async function runCode() {
  if (!isPyodideReady) {
    showToast('Python ещё загружается...', 'warning');
    return;
  }
  
  const code = document.getElementById('codeEditor').value;
  const outputEl = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');
  
  runBtn.disabled = true;
  runBtn.textContent = '⏳ Выполняется...';
  outputEl.textContent = '';
  outputEl.style.color = '#d0d0d5';
  
  try {
    // Capture stdout
    pyodide.runPython(`
import sys
from io import StringIO
_stdout_capture = StringIO()
sys.stdout = _stdout_capture
    `);
    
    // Run user code
    await pyodide.runPythonAsync(code);
    
    // Get output
    const output = pyodide.runPython(`
_stdout_capture.getvalue()
    `);
    
    // Restore stdout
    pyodide.runPython(`
sys.stdout = sys.__stdout__
    `);
    
    outputEl.textContent = output || '(нет вывода)';
    if (!output) outputEl.style.color = '#676e95';
  } catch (err) {
    pyodide.runPython(`sys.stdout = sys.__stdout__`);
    outputEl.textContent = '❌ Ошибка:\n' + err.message;
    outputEl.style.color = '#f78c6c';
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '▶ Запустить';
  }
}

async function checkTask() {
  if (!isPyodideReady) return;
  
  const lesson = lessons[currentLessonIndex];
  const code = document.getElementById('codeEditor').value;
  const feedbackEl = document.getElementById('taskFeedback');
  
  feedbackEl.classList.remove('hidden');
  feedbackEl.innerHTML = '<div class="text-gray-400">⏳ Проверяю...</div>';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
_stdout_capture = StringIO()
sys.stdout = _stdout_capture
    `);
    
    await pyodide.runPythonAsync(code);
    
    const output = pyodide.runPython(`_stdout_capture.getvalue()`);
    pyodide.runPython(`sys.stdout = sys.__stdout__`);
    
    const isCorrect = lesson.check(output);
    
    if (isCorrect) {
      feedbackEl.innerHTML = `
        <div class="bg-[#acd157]/10 border border-[#acd157] rounded-lg p-4">
          <div class="text-[#acd157] font-bold text-lg mb-1">✅ Отлично!</div>
          <div class="text-white">Задание выполнено верно. Так держать!</div>
        </div>
      `;
      
      if (!completedLessons.includes(lesson.id)) {
        completedLessons.push(lesson.id);
        localStorage.setItem('pycamp_completed', JSON.stringify(completedLessons));
        updateProgress();
        renderNav();
        showToast('🎉 Урок завершён!', 'success');
      }
    } else {
      feedbackEl.innerHTML = `
        <div class="bg-red-500/10 border border-red-500 rounded-lg p-4">
          <div class="text-red-400 font-bold text-lg mb-1">❌ Не совсем</div>
          <div class="text-white">Вывод не совпадает с ожидаемым. Попробуйте ещё раз!</div>
          <div class="text-gray-400 text-sm mt-2">Ваш вывод: <code class="bg-[#2a2a40] px-2 py-1 rounded">${escapeHtml(output.slice(0, 100))}</code></div>
        </div>
      `;
    }
  } catch (err) {
    pyodide.runPython(`sys.stdout = sys.__stdout__`);
    feedbackEl.innerHTML = `
      <div class="bg-red-500/10 border border-red-500 rounded-lg p-4">
        <div class="text-red-400 font-bold text-lg mb-1">❌ Ошибка в коде</div>
        <div class="text-white">${escapeHtml(err.message)}</div>
      </div>
    `;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, type = 'info') {
  const colors = { success: '#acd157', warning: '#f78c6c', info: '#80bdff' };
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.background = colors[type];
  toast.style.color = type === 'success' ? '#1b1b32' : '#fff';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function showCertificate() {
  const percent = Math.round((completedLessons.length / lessons.length) * 100);
  const isComplete = completedLessons.length === lessons.length;
  
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="bg-[#0a0a23] border border-[#3b3b4f] rounded-xl p-8 max-w-lg mx-4 text-center">
      <div class="text-6xl mb-4">${isComplete ? '🎓' : '📜'}</div>
      <h2 class="text-2xl font-bold text-white mb-2">
        ${isComplete ? 'Сертификат о прохождении' : 'Сертификат'}
      </h2>
      <p class="text-gray-400 mb-6">
        ${isComplete 
          ? 'Поздравляем! Вы успешно завершили курс Python Programming.' 
          : `Вы прошли ${completedLessons.length} из ${lessons.length} уроков (${percent}%). Завершите все уроки, чтобы получить сертификат.`}
      </p>
      ${isComplete ? `
        <div class="bg-gradient-to-br from-[#acd157]/20 to-[#80bdff]/20 border-2 border-[#acd157] rounded-lg p-6 mb-6">
          <div class="text-xs text-gray-400 uppercase tracking-wider mb-2">Сертификат</div>
          <div class="text-3xl font-bold text-white mb-2">Python Programming</div>
          <div class="text-[#acd157]">PyCamp • ${new Date().toLocaleDateString('ru-RU')}</div>
          <div class="mt-4 text-sm text-gray-400">ID: PY-${Date.now().toString(36).toUpperCase()}</div>
        </div>
      ` : `
        <div class="progress-bar mb-4"><div class="progress-fill" style="width:${percent}%"></div></div>
      `}
      <button onclick="this.closest('.modal-backdrop').remove()" class="btn-primary">Закрыть</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) {
    completedLessons = [];
    localStorage.removeItem('pycamp_completed');
    currentLessonIndex = 0;
    renderLesson();
    showToast('Прогресс сброшен', 'info');
  }
}

// Tab key support in editor
document.addEventListener('DOMContentLoaded', () => {
  const editor = document.getElementById('codeEditor');
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
    }
  });
  
  // Ctrl+Enter to run
  editor.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
  
  // Mobile menu
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
});

// Start
renderLesson();
initPyodide();
</script>
